# CI configuration for Codeberg

on:
  - push
  - pull_request

enable-email-notifications: true

name: build
jobs:
  build:
    runs-on: debian
    strategy:
      matrix:
        ghc: ['9.2.8', '9.6.7', '9.8.4', '9.10.3', '9.12.4']

    name: GHC ${{ matrix.ghc }}
    steps:
      - name: Check out project
        uses: actions/checkout@v6

      - name: Restore cached GHC
        id: ghcup-cache
        uses: actions/cache/restore@v5
        with:
          path: /root/.ghcup
          key: ${{ runner.os }}-ghcup-ghc${{ matrix.ghc }}

      - name: Set up GHC
        uses: https://github.com/haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: ${{ matrix.ghc }}

      - name: Save cached GHC
        uses: actions/cache/save@v5
        if: steps.ghcup-cache.outputs.cache-hit != 'true'
        with:
          path: /root/.ghcup
          key: ${{ steps.ghcup-cache.outputs.cache-primary-key }}

      - name: Configure the build
        run: |
          cabal configure --enable-tests --enable-benchmarks --disable-documentation --upgrade-dependencies
          cabal build all --dry-run

      - name: Restore cached dependencies
        uses: actions/cache/restore@v5
        id: cache
        env:
          key: ${{ runner.os }}-ghc-${{ steps.setup.outputs.ghc-version }}-cabal-${{ steps.setup.outputs.cabal-version }}
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ env.key }}-plan-${{ hashFiles('**/plan.json') }}
          restore-keys: ${{ env.key }}-

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: cabal build all --only-dependencies

      - name: Save cached dependencies
        uses: actions/cache/save@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Build project
        run: cabal build

      - name: Run tests
        run: cabal test
